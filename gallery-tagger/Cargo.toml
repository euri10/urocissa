[package]
name = "gallery-tagger"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Stateless SigLIP 2 embedding sidecar for Urocissa auto-tagging"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4.35"
openvino = { version = "0.11.1", features = ["runtime-linking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = { level = "allow", priority = 0 }
